<div>
  <h1 class="text-2xl font-bold text-secondary-900 mb-6">Dashboard</h1>

  <!-- Error State -->
  @if (error()) {
    <div class="bg-red-50 border border-red-200 rounded-xl p-6 mb-8">
      <div class="flex items-center gap-3">
        <span class="text-2xl">⚠️</span>
        <div class="flex-1">
          <p class="text-red-800 font-medium">{{ error() }}</p>
          <p class="text-red-600 text-sm mt-1">Verifiez votre connexion et reessayez.</p>
        </div>
        <button
          (click)="retry()"
          class="px-4 py-2 bg-red-600 text-white rounded-lg hover:bg-red-700 transition-colors"
        >
          Reessayer
        </button>
      </div>
    </div>
  }

  <!-- Loading State -->
  @if (isLoading()) {
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-8">
      @for (i of [1, 2, 3, 4]; track i) {
        <div class="bg-white rounded-xl shadow-sm border border-secondary-200 p-6 animate-pulse">
          <div class="h-4 bg-secondary-200 rounded w-24 mb-3"></div>
          <div class="h-8 bg-secondary-200 rounded w-32 mb-2"></div>
          <div class="h-3 bg-secondary-200 rounded w-20"></div>
        </div>
      }
    </div>
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 mb-8">
      <div class="lg:col-span-2 bg-white rounded-xl shadow-sm border border-secondary-200 p-6 animate-pulse">
        <div class="h-6 bg-secondary-200 rounded w-32 mb-4"></div>
        <div class="h-64 bg-secondary-200 rounded"></div>
      </div>
      <div class="bg-white rounded-xl shadow-sm border border-secondary-200 p-6 animate-pulse">
        <div class="h-6 bg-secondary-200 rounded w-40 mb-4"></div>
        <div class="h-48 bg-secondary-200 rounded-full w-48 mx-auto"></div>
      </div>
    </div>
  } @else {
    <!-- KPI Cards Grid -->
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-8">
      <app-kpi-card
        title="Chiffre d'affaires"
        [value]="stats()?.monthlyRevenue || 0"
        format="currency"
        [growth]="stats()?.revenueGrowth"
        icon="💰"
        iconBgClass="bg-green-100"
        subtitle="Ce mois"
      />
      <app-kpi-card
        title="Commandes"
        [value]="stats()?.monthlyOrders || 0"
        icon="🛒"
        iconBgClass="bg-blue-100"
        [subtitle]="pendingOrdersText()"
      />
      <app-kpi-card
        title="Clients"
        [value]="stats()?.totalCustomers || 0"
        icon="👥"
        iconBgClass="bg-purple-100"
        [subtitle]="newCustomersText()"
      />
      <app-kpi-card
        title="Produits"
        [value]="stats()?.totalProducts || 0"
        icon="📦"
        iconBgClass="bg-orange-100"
        [subtitle]="lowStockText()"
      />
    </div>

    <!-- Charts Row -->
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 mb-8">
      <div class="lg:col-span-2">
        <app-revenue-chart [data]="revenueChart()" />
      </div>
      <app-orders-chart [data]="ordersByStatus()" />
    </div>

    <!-- Tables Row -->
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 mb-8">
      <app-recent-orders [orders]="recentOrders()" />
      <app-low-stock [items]="lowStockItems()" />
    </div>

    <!-- Bottom Row -->
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
      <div class="lg:col-span-2">
        <app-activity-feed [activities]="activities()" />
      </div>
      <app-quick-actions />
    </div>
  }
</div>

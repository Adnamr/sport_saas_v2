<header class="h-16 bg-white border-b border-secondary-200 px-6 flex items-center justify-between sticky top-0 z-30">
  <!-- Left side -->
  <div class="flex items-center gap-4">
    <button
      (click)="toggleSidebar.emit()"
      class="p-2 rounded-lg text-secondary-500 hover:bg-secondary-100 lg:hidden"
    >
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
      </svg>
    </button>

    <!-- Search -->
    <div class="hidden md:block relative">
      <input
        type="text"
        placeholder="Rechercher..."
        class="w-64 pl-10 pr-4 py-2 text-sm border border-secondary-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-primary-500"
      />
      <svg class="w-5 h-5 text-secondary-400 absolute left-3 top-1/2 -translate-y-1/2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
      </svg>
    </div>
  </div>

  <!-- Right side -->
  <div class="flex items-center gap-4">
    <!-- Notifications -->
    <button class="p-2 rounded-lg text-secondary-500 hover:bg-secondary-100 relative">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" />
      </svg>
      <span class="absolute top-1 right-1 w-2 h-2 bg-red-500 rounded-full"></span>
    </button>

    <!-- User menu -->
    <div class="relative" (click)="showUserMenu = !showUserMenu">
      <button class="flex items-center gap-3 p-2 rounded-lg hover:bg-secondary-100">
        <div class="w-8 h-8 bg-primary-100 text-primary-600 rounded-full flex items-center justify-center font-medium text-sm">
          {{ userInitials }}
        </div>
        <div class="hidden md:block text-left">
          <p class="text-sm font-medium text-secondary-900">{{ userName }}</p>
          <p class="text-xs text-secondary-500">{{ userRole }}</p>
        </div>
        <svg class="w-4 h-4 text-secondary-400 hidden md:block" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
        </svg>
      </button>

      <!-- Dropdown -->
      @if (showUserMenu) {
        <div class="absolute right-0 mt-2 w-48 bg-white rounded-lg shadow-lg border border-secondary-200 py-1 z-50">
          <a routerLink="/profile" class="block px-4 py-2 text-sm text-secondary-700 hover:bg-secondary-100">
            Mon profil
          </a>
          <a routerLink="/settings" class="block px-4 py-2 text-sm text-secondary-700 hover:bg-secondary-100">
            Parametres
          </a>
          <hr class="my-1 border-secondary-200" />
          <button
            (click)="logout()"
            class="block w-full text-left px-4 py-2 text-sm text-red-600 hover:bg-red-50"
          >
            Deconnexion
          </button>
        </div>
      }
    </div>
  </div>
</header>
